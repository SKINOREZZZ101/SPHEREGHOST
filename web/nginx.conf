server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip for the premium-but-light bundle
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public subscription delivery — served directly by the engine (no auth,
    # no BFF). X-Forwarded-Proto is forced to https so the engine's proxy check
    # accepts requests even when the panel is accessed over plain HTTP.
    # Using the Docker embedded resolver + a variable upstream lets nginx
    # re-resolve the engine container if it restarts (avoids stale-IP 502s).
    location /api/sub/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gs_engine backend;
        proxy_pass http://$gs_engine:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Proxy the Ghost Sphere Core gateway (keeps the /api prefix).
    # The API is plain HTTP/JSON (no websockets), so use clean keep-alive
    # instead of forcing a Connection: upgrade (which can break POST bodies).
    location /api/ {
        proxy_pass http://api:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    # SPA fallback — all client routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
