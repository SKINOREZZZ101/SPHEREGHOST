<!doctype html>
<html lang="ru" data-mantine-color-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ghost.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0C10" />
    <meta name="description" content="Ghost Sphere — премиальная единая панель управления экосистемой VPN. Разработано Ghost OS." />
    <title>Ghost Sphere — Control Plane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background-color: #0a0c10;
      }
      /* Pre-hydration boot screen to avoid white flash */
      #gs-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(900px circle at 50% 10%, rgba(255, 255, 255, 0.05), transparent 60%),
          radial-gradient(700px circle at 80% 90%, rgba(200, 205, 216, 0.05), transparent 55%), #0a0c10;
        z-index: 9999;
        transition: opacity 0.45s ease;
      }
      #gs-boot .gs-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      #gs-boot .gs-stage {
        position: relative;
        width: 92px;
        height: 106px;
      }
      #gs-boot .gs-ghost {
        animation:
          gs-boot-float 2.6s ease-in-out infinite,
          gs-boot-glow 2.6s ease-in-out infinite;
      }
      #gs-boot .gs-shadow {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 52%;
        height: 9px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(0, 0, 0, 0.55), transparent 70%);
        animation: gs-boot-shadow 2.6s ease-in-out infinite;
      }
      #gs-boot .gs-dots {
        display: flex;
        gap: 7px;
      }
      #gs-boot .gs-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #c8cdd8;
        animation: gs-boot-dot 1.4s ease-in-out infinite;
      }
      #gs-boot .gs-dots span:nth-child(2) {
        animation-delay: 0.16s;
      }
      #gs-boot .gs-dots span:nth-child(3) {
        animation-delay: 0.32s;
      }
      #gs-boot .gs-label {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2em;
        background: linear-gradient(135deg, #fff, #c8cdd8 55%, #94a3b8);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      @keyframes gs-boot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-11px); }
      }
      @keyframes gs-boot-glow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(200, 205, 216, 0.3)); }
        50% { filter: drop-shadow(0 0 22px rgba(200, 205, 216, 0.55)); }
      }
      @keyframes gs-boot-shadow {
        0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.4; }
        50% { transform: translateX(-50%) scaleX(0.66); opacity: 0.18; }
      }
      @keyframes gs-boot-dot {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40% { transform: translateY(-5px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="gs-boot">
      <div class="gs-wrap">
        <div class="gs-stage">
          <svg class="gs-ghost" width="92" height="92" viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="gsbg" x1="18" y1="10" x2="46" y2="54" gradientUnits="userSpaceOnUse">
                <stop stop-color="#ffffff" />
                <stop offset="0.55" stop-color="#c8cdd8" />
                <stop offset="1" stop-color="#8d97a8" />
              </linearGradient>
            </defs>
            <path
              d="M32 11c-9.4 0-17 7.6-17 17v20.5c0 1.9 2.2 2.9 3.7 1.7l3.4-2.8a2.6 2.6 0 0 1 3.3 0l3 2.5a2.6 2.6 0 0 0 3.2 0l3-2.5a2.6 2.6 0 0 1 3.3 0l3.4 2.8c1.5 1.2 3.7.2 3.7-1.7V28c0-9.4-7.6-17-17-17z"
              fill="url(#gsbg)"
            />
            <circle cx="25.5" cy="28" r="3.1" fill="#0a0c10" />
            <circle cx="38.5" cy="28" r="3.1" fill="#0a0c10" />
          </svg>
          <div class="gs-shadow"></div>
        </div>
        <div class="gs-dots"><span></span><span></span><span></span></div>
        <div class="gs-label">GHOST SPHERE</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
