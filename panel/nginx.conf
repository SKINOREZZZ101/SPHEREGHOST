server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml application/xml font/woff2;
    gzip_min_length 1024;

    # Long-cache hashed build assets (JS/CSS/wasm/fonts)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ghost Sphere Engine API (admin + subscriptions live behind /api).
    # The engine enforces a reverse-proxy + HTTPS contract, so we assert the
    # forwarded headers here (X-Forwarded-Proto MUST be https, X-Forwarded-For
    # MUST be present) regardless of how the operator reaches the panel.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback — every client route resolves to the panel shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
